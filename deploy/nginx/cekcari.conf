# =============================================================================
# CekCari — Nginx (templat; dipasang oleh deploy/setup-domain.sh)
# =============================================================================
#
# Satu aplikasi AdonisJS melayani dua domain: pencarian publik dan panel pemilik.
# Aplikasi membedakannya dari header Host, jadi Host asli WAJIB diteruskan.
# Nilai __SEPERTI_INI__ diganti setup-domain.sh dari .env.

server {
    listen 80;
    server_name __SEARCH_DOMAIN__ __PANEL_DOMAIN__;

    # Tantangan ACME Let's Encrypt — satu-satunya yang dilayani lewat HTTP, ditulis sebelum
    # pengalihan agar perpanjangan otomatis tidak gagal diam-diam.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Cookie sesi panel ber-flag Secure, jadi semuanya dialihkan ke HTTPS.
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # Bentuk untuk Nginx < 1.25 (Ubuntu 22.04/24.04); `http2 on;` belum dikenal versi lama.
    listen 443 ssl http2;
    server_name __SEARCH_DOMAIN__ __PANEL_DOMAIN__;

    ssl_certificate     __SSL_CERTIFICATE__;
    ssl_certificate_key __SSL_CERTIFICATE_KEY__;

    server_tokens off;

    # JavaScript dan CSS tidak termasuk gzip_types bawaan Ubuntu, padahal keduanya yang terbesar.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/json application/javascript
        application/xml application/manifest+json image/svg+xml;

    # Panel hanya menerima JSON kecil (link situs, kode 2FA); tidak ada unggahan berkas.
    client_max_body_size 1m;

    location / {
        # Di belakang Cloudflare (awan jingga): pulihkan alamat pengunjung dari rentang
        # Cloudflare saja. Diaktifkan otomatis oleh setup-domain.sh.
        #     include /etc/nginx/cloudflare-realip.conf;

        proxy_pass http://127.0.0.1:__APP_PORT__;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # Ditimpa, BUKAN ditambah ($proxy_add_x_forwarded_for): aplikasi mempercayai header ini
        # dari nginx (TRUSTED_PROXIES=127.0.0.1), jadi isinya harus alamat yang sudah diperiksa
        # nginx, bukan rantai yang bisa disisipi pengunjung untuk melewati whitelist IP.
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 60s;
    }
}
