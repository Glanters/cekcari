services:
    postgres:
        image: postgres:17-alpine
        environment:
            POSTGRES_DB: ${DB_DATABASE}
            POSTGRES_USER: ${DB_USERNAME}
            POSTGRES_PASSWORD: ${DB_PASSWORD}
        ports:
            - "127.0.0.1:${DB_PORT}:5432"
        volumes:
            - postgres-data:/var/lib/postgresql/data
            - ./docker/postgres/create-test-database.sh:/docker-entrypoint-initdb.d/create-test-database.sh:ro
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE}"]
            interval: 5s
            timeout: 5s
            retries: 10

    redis:
        image: redis:7.4.11-alpine
        command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
        ports:
            - "127.0.0.1:${REDIS_PORT}:6379"
        volumes:
            - redis-data:/data

    minio:
        image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
        command: ["server", "/data", "--console-address", ":9001"]
        environment:
            MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID}
            MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY}
        ports:
            - "127.0.0.1:${MINIO_API_PORT}:9000"
            - "127.0.0.1:${MINIO_CONSOLE_PORT}:9001"
        volumes:
            - minio-data:/data
        healthcheck:
            test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
            interval: 5s
            timeout: 5s
            retries: 10

    # Bucket dan aturan baca-publik untuk logo dibuat sekali saat stack dinyalakan,
    # agar developer baru tidak perlu menyiapkannya manual lewat konsol MinIO.
    minio-setup:
        image: pgsty/mc:RELEASE.2026-09-16T00-00-00Z
        depends_on:
            minio:
                condition: service_healthy
        environment:
            MINIO_USER: ${AWS_ACCESS_KEY_ID}
            MINIO_PASSWORD: ${AWS_SECRET_ACCESS_KEY}
            BUCKET: ${AWS_BUCKET}
        entrypoint: >
            /bin/sh -c "
            mc alias set local http://minio:9000 $$MINIO_USER $$MINIO_PASSWORD &&
            mc mb --ignore-existing local/$$BUCKET &&
            mc anonymous set download local/$$BUCKET/logos
            "

volumes:
    postgres-data:
    redis-data:
    minio-data:
